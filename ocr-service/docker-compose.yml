version: "3.8"

services:
  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: legal-metrology-service:latest
    container_name: legal-metrology-ocr-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WEB_CONCURRENCY=2
      - LOG_LEVEL=INFO
    volumes:
      # Mount application code for hot reloading during local development
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
