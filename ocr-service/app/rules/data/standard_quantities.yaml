# standard_quantities.yaml
#
# Schedule 2 / Third Schedule lookup table for the Legal Metrology
# (Packaged Commodities) Rules, 2011.
#
# TODO: verify against current Legal Metrology Rules text, last checked: 2026-09-15
# Source referenced: Legal Metrology (Packaged Commodities) Rules, 2011 —
# Second Schedule (standard quantities for specified commodities) and
# Third Schedule (SI units and quantity types).
#
# Structure per category:
#   dimensions_required: bool      — whether Rule 6 requires dimensions on label
#   permitted_qualifier_types:     — qualifier types allowed by Rules 11–17
#     - WHEN_PACKED
#     - MINIMUM
#     - NOT_LESS_THAN
#     - AVERAGE
#   permitted_units:               — permitted SI units keyed by quantity_type
#     weight: [g, kg, mg]
#     volume: [ml, l, cl]
#     length: [m, cm, mm]
#     count:  [No, N]
#   standard_quantities:           — (value, unit) pairs from Second Schedule
#     - [value, unit]
#
# Categories NOT yet covered are noted with: # TODO: no Schedule 2/3 data yet

